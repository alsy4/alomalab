apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-community
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: psql

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.4.1
      helm:
        releaseName: prometheus-community
        valueFiles:
          - $values/kube/monitoring/values.yml

    - repoURL: https://github.com/alsy4/alomalab.git
      targetRevision: kube
      ref: values
      path: kube/monitoring/manifests

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
