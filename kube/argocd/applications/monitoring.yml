apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-community
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: psql

  sources:
    # Source 1: the same chart version already installed.
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.4.1
      helm:
        releaseName: prometheus-community
        valueFiles:
          - $values/kube/monitoring/values.yaml

    # Source 2: your Helm values and additional manifests.
    - repoURL: https://github.com/YOUR-USER/YOUR-REPO.git
      targetRevision: main
      ref: values
      path: kube/monitoring/manifests

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
