apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: psql
  namespace: psql
spec:
  instances: 2
  storage:
    size: 1Gi
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: ingestor-db
            spec:
              type: LoadBalancer
