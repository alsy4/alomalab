apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: glance-dashboard
  name: glance-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: glance-dashboard
  strategy: {}
  template:
    metadata:
      labels:
        app: glance-dashboard
    spec:
      containers:
        - image: glanceapp/glance@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
          name: glance
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: PROXMOX_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: glance-proxmox
                  key: authorization
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: assets
              mountPath: /app/assets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: glance-config
        - name: assets
          configMap:
            name: glance-assets

status: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: glance
  name: glance
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: glance-dashboard
  type: ClusterIP
status:
  loadBalancer: {}
