apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: glance-dashboard

resources:
  - deployment.yml
  - ingress.yml
configMapGenerator:
  - name: glance-config
    files:
      - config/glance.yml
      - config/home.yml
      - config/start.yml
      - config/proxmox.yml
  - name: glance-assets
    files:
      - assets/user.css
