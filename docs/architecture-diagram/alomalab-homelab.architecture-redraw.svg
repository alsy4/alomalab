<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="alomalab-homelab-title alomalab-homelab-desc">
      <title id="alomalab-homelab-title">AlomaLab homelab architecture</title>
      <desc id="alomalab-homelab-desc">Terraform and Ansible manage a Proxmox node hosting NAS and Jellyfin containers, with shared storage and internal Caddy access to Jellyfin.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="alomalab-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="alomalab-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
        <marker id="alomalab-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1180" height="720" fill="#f5f5f5"/>

      <text x="40" y="44" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing=".16em">ARCHITECTURE · CONFIRMED CONFIGURATION</text>
      <text x="40" y="88" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">AlomaLab homelab</text>
      <text x="40" y="112" fill="#4f5d75" font-size="12" font-family="Geist, sans-serif">Two Terraform-managed Debian LXC containers on Proxmox, with internal Jellyfin access.</text>

      <!-- Trust boundary, drawn before connectors and nodes. -->
      <rect x="464" y="204" width="244" height="312" rx="8" fill="#2d3142" fill-opacity=".02" stroke="#2d3142" stroke-opacity=".18" stroke-width=".8" stroke-dasharray="4 4"/>
      <rect x="480" y="208" width="176" height="16" rx="2" fill="#f5f5f5"/>
      <text x="488" y="220" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing=".11em">PROXMOX-MANAGED LXCS</text>

      <!-- Connectors. -->
      <line x1="200" y1="368" x2="260" y2="368" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#alomalab-arrow-accent)"/>
      <rect x="208" y="348" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="232" y="357" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".04em">API · SSH</text>

      <path d="M420 352 H448 Q456 352 456 344 V292 Q456 284 464 284 H496" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#alomalab-arrow)"/>
      <rect x="376" y="304" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="313" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".04em">HOSTS LXC</text>

      <path d="M420 384 H448 Q456 384 456 392 V440 Q456 448 464 448 H496" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#alomalab-arrow)"/>
      <rect x="376" y="420" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="429" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".04em">HOSTS LXC</text>

      <path d="M676 284 H712 Q720 284 720 292 V352 Q720 360 728 360 H760" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#alomalab-arrow)"/>
