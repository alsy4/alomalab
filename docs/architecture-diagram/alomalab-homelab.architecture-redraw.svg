        <text x="340" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Proxmox node</text>
        <text x="340" y="391" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.0.20 · vmbr0</text>
      </g>
      <g>
        <rect x="496" y="248" width="180" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="496" y="248" width="180" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
        <rect x="504" y="256" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".40" stroke-width=".8"/>
        <text x="520" y="265" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".08em">LXC</text>
        <text x="586" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">NAS LXC</text>
        <text x="586" y="307" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VMID 102 · Samba · Syncthing</text>
      </g>
      <g>
        <rect x="496" y="412" width="180" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="496" y="412" width="180" height="72" rx="6" fill="#eb6c36" fill-opacity=".10" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="504" y="420" width="32" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity=".60" stroke-width=".8"/>
