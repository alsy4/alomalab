<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="alomalab-homelab.architecture-redraw-title alomalab-homelab.architecture-redraw-desc">
      <title id="alomalab-homelab.architecture-redraw-title">AlomaLab homelab and K3s architecture</title>
      <desc id="alomalab-homelab.architecture-redraw-desc">Architecture showing a Proxmox host with a three-VM K3s cluster and two LXC services, plus a separately managed Raspberry Pi running Caddy outside Kubernetes.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="alomalab-k8s-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
        </marker>
        <marker id="alomalab-k8s-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
        </marker>
        <marker id="alomalab-k8s-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="1280" height="720" fill="#f5f5f5"/>

      <text x="40" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing=".16em">ARCHITECTURE · DECLARED INFRASTRUCTURE + EXTERNAL PROXY</text>
      <text x="40" y="80" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">AlomaLab homelab</text>
      <text x="40" y="108" fill="#4f5d75" font-size="12" font-family="Geist, sans-serif">Terraform provisions three K3s VMs; Ansible forms the cluster; Piloma runs Caddy outside Kubernetes.</text>

      <!-- Zones. -->
      <rect x="40" y="140" width="856" height="488" rx="8" fill="#2d3142" fill-opacity=".02" stroke="#2d3142" stroke-opacity=".16" stroke-width=".8"/>
      <rect x="56" y="144" width="184" height="16" rx="2" fill="#f5f5f5"/>
      <text x="64" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing=".13em">PROXMOX · 192.168.0.20</text>

      <rect x="64" y="172" width="808" height="236" rx="8" fill="#2d3142" fill-opacity=".018" stroke="#2d3142" stroke-opacity=".12" stroke-width=".8"/>
      <rect x="80" y="176" width="252" height="16" rx="2" fill="#f5f5f5"/>
      <text x="88" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing=".11em">K3S CLUSTER · TERRAFORM VMS + ANSIBLE</text>

      <rect x="64" y="432" width="808" height="124" rx="8" fill="#2d3142" fill-opacity=".018" stroke="#2d3142" stroke-opacity=".12" stroke-width=".8"/>
      <rect x="80" y="436" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="88" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing=".12em">DEBIAN LXC SERVICES</text>

      <!-- Connectors are drawn before nodes. -->
      <path d="M400 288 V292 Q400 300 392 300 H204 Q196 300 196 308 V312" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#alomalab-k8s-arrow)"/>
      <rect x="224" y="280" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="289" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">K3S JOIN</text>

      <path d="M480 288 V292 Q480 300 488 300 H708 Q716 300 716 308 V312" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#alomalab-k8s-arrow)"/>
      <rect x="568" y="280" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="289" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">K3S JOIN</text>

      <line x1="288" y1="504" x2="344" y2="504" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#alomalab-k8s-arrow)"/>
      <rect x="292" y="484" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="316" y="493" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">SHARED</text>

      <line x1="600" y1="504" x2="544" y2="504" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#alomalab-k8s-arrow)"/>
      <rect x="552" y="484" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="572" y="493" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">MEDIA</text>

      <path d="M1120 288 V512 Q1120 520 1112 520 H840" fill="none" stroke="#2e5aa8" stroke-width="1.1" marker-end="url(#alomalab-k8s-arrow-link)"/>
      <rect x="880" y="500" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="932" y="509" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".05em">CADDY :8096</text>

      <!-- Kubernetes nodes. -->
      <g>
        <rect x="320" y="208" width="240" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="208" width="240" height="80" rx="6" fill="#eb6c36" fill-opacity=".10" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="328" y="216" width="72" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity=".60" stroke-width=".8"/>
        <text x="364" y="225" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".08em">K3S SERVER</text>
        <text x="440" y="253" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">K3s control plane</text>
        <text x="440" y="273" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VMID 20100 · 192.168.0.200</text>
      </g>

      <g>
        <rect x="96" y="312" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="96" y="312" width="200" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
        <rect x="104" y="320" width="72" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".40" stroke-width=".8"/>
        <text x="140" y="329" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".08em">K3S AGENT</text>
        <text x="196" y="357" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">K3s worker 01</text>
        <text x="196" y="377" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VMID 20101 · 192.168.0.201</text>
      </g>

      <g>
        <rect x="616" y="312" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="616" y="312" width="200" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
        <rect x="624" y="320" width="72" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".40" stroke-width=".8"/>
        <text x="660" y="329" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".08em">K3S AGENT</text>
        <text x="716" y="357" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">K3s worker 02</text>
        <text x="716" y="377" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VMID 20102 · 192.168.0.202</text>
      </g>

      <!-- External reverse proxy. -->
      <g>
        <rect x="1000" y="208" width="240" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="1000" y="208" width="240" height="80" rx="6" fill="#2d3142" fill-opacity=".025" stroke="#2d3142" stroke-opacity=".30" stroke-dasharray="4 3"/>
        <rect x="1008" y="216" width="80" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity=".45" stroke-width=".8"/>
        <text x="1048" y="225" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".08em">CADDY · EXTERNAL</text>
        <text x="1120" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Piloma reverse proxy</text>
        <text x="1120" y="266" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Piloma · 192.168.0.14</text>
        <text x="1120" y="279" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Caddy · outside Kubernetes</text>
      </g>

      <!-- LXC services and storage. -->
      <g>
        <rect x="88" y="464" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="464" width="200" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
        <rect x="96" y="472" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".40" stroke-width=".8"/>
        <text x="112" y="481" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".08em">LXC</text>
        <text x="188" y="509" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">NAS LXC</text>
        <text x="188" y="529" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VMID 102 · Samba · Syncthing</text>
      </g>

      <g>
        <rect x="344" y="464" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="344" y="464" width="200" height="80" rx="6" fill="#2d3142" fill-opacity=".05" stroke="#4f5d75"/>
        <rect x="352" y="472" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity=".45" stroke-width=".8"/>
        <text x="372" y="481" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".08em">STORE</text>
        <text x="444" y="509" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Host-backed storage</text>
        <text x="444" y="529" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/mnt/hdd · shared + media</text>
      </g>

      <g>
        <rect x="600" y="464" width="240" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="464" width="240" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
        <rect x="608" y="472" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".40" stroke-width=".8"/>
        <text x="624" y="481" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".08em">LXC</text>
        <text x="720" y="509" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Jellyfin LXC</text>
        <text x="720" y="529" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VMID 103 · Jellyfin :8096</text>
      </g>

      <!-- Declared network not used by the K3s VMs. -->
      <g>
        <rect x="64" y="580" width="808" height="32" rx="6" fill="#2d3142" fill-opacity=".02" stroke="#2d3142" stroke-opacity=".20" stroke-dasharray="4 3"/>
        <text x="80" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing=".10em">RESERVED SDN</text>
        <text x="196" y="600" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">k3szone · k3svnet · vmbr20 · 192.168.20.0/24 · no K3s VM attachment</text>
      </g>

      <!-- Legend. -->
      <line x1="40" y1="648" x2="1240" y2="648" stroke="#2d3142" stroke-opacity=".12" stroke-width=".8"/>
      <text x="40" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing=".14em">LEGEND</text>

      <rect x="132" y="665" width="12" height="12" rx="2" fill="#fff" stroke="#2d3142"/>
      <text x="152" y="675" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Terraform guest</text>

      <rect x="280" y="665" width="12" height="12" rx="2" fill="#eb6c36" fill-opacity=".10" stroke="#eb6c36"/>
      <text x="300" y="675" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">K3s control plane</text>

      <rect x="464" y="665" width="12" height="12" rx="2" fill="#2d3142" fill-opacity=".025" stroke="#2d3142" stroke-opacity=".30" stroke-dasharray="3 2"/>
      <text x="484" y="675" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">external host</text>

      <line x1="660" y1="671" x2="684" y2="671" stroke="#2e5aa8" stroke-width="1.1" marker-end="url(#alomalab-k8s-arrow-link)"/>
      <text x="696" y="675" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Caddy route</text>

      <rect x="816" y="665" width="24" height="12" rx="2" fill="#2d3142" fill-opacity=".02" stroke="#2d3142" stroke-opacity=".20" stroke-dasharray="3 2"/>
      <text x="850" y="675" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">declared, unattached infrastructure</text>

      <text x="40" y="706" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">SOURCE: TERRAFORM + ANSIBLE · PILOMA IS THE EXTERNAL CADDY HOST · RUNTIME STATE NOT IMPLIED</text>
    </svg>
