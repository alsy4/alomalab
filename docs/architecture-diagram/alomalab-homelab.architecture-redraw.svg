      <rect x="928" y="176" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="956" y="185" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".04em">TLS · DNS</text>

