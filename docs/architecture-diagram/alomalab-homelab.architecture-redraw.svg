      <g>
        <rect x="40" y="332" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="332" width="160" height="72" rx="6" fill="#2d3142" fill-opacity=".03" stroke="#2d3142" stroke-opacity=".30"/>
        <rect x="48" y="340" width="56" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity=".45" stroke-width=".8"/>
        <text x="76" y="349" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".08em">AUTOMATION</text>
        <text x="120" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Terraform + Ansible</text>
        <text x="120" y="391" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">provision + configure</text>
      </g>
