        <text x="586" y="454" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Jellyfin LXC</text>
        <text x="586" y="471" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VMID 103 · Jellyfin :8096</text>
      </g>
      <g>
        <rect x="760" y="336" width="188" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="336" width="188" height="72" rx="6" fill="#2d3142" fill-opacity=".05" stroke="#4f5d75"/>
        <rect x="768" y="344" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity=".45" stroke-width=".8"/>
        <text x="788" y="353" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".08em">STORE</text>
        <text x="854" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Host-backed storage</text>
        <text x="854" y="395" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/mnt/hdd · shared + media</text>
      </g>
      <g>
        <rect x="760" y="160" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="160" width="160" height="72" rx="6" fill="#eb6c36" fill-opacity=".05" stroke="#eb6c36" stroke-opacity=".50" stroke-dasharray="4 4"/>
        <rect x="768" y="168" width="56" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity=".50" stroke-width=".8"/>
        <text x="796" y="177" fill="#b7522b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".08em">SECURITY</text>
        <text x="840" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Piloma</text>
        <text x="840" y="219" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">192.168.0.14 · Caddy</text>
      </g>
      <g>
        <rect x="990" y="160" width="150" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="990" y="160" width="150" height="72" rx="6" fill="#2d3142" fill-opacity=".03" stroke="#2d3142" stroke-opacity=".30"/>
        <rect x="998" y="168" width="56" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity=".45" stroke-width=".8"/>
        <text x="1026" y="177" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".08em">EXTERNAL</text>
        <text x="1065" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Home clients</text>
        <text x="1065" y="219" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Jellyfin users</text>
      </g>

      <!-- Legend. -->
      <line x1="40" y1="640" x2="1140" y2="640" stroke="#2d3142" stroke-opacity=".12" stroke-width=".8"/>
      <text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing=".14em">LEGEND</text>
      <rect x="132" y="657" width="12" height="12" rx="2" fill="#fff" stroke="#2d3142"/>
      <text x="152" y="667" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">managed host / service</text>
      <rect x="332" y="657" width="12" height="12" rx="2" fill="#2d3142" fill-opacity=".05" stroke="#4f5d75"/>
      <text x="352" y="667" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">host-backed storage</text>
      <rect x="520" y="657" width="12" height="12" rx="2" fill="#eb6c36" fill-opacity=".05" stroke="#eb6c36" stroke-opacity=".50" stroke-dasharray="3 2"/>
      <text x="540" y="667" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">security / ingress</text>
      <line x1="714" y1="663" x2="738" y2="663" stroke="#2e5aa8" stroke-width="1.1" marker-end="url(#alomalab-arrow-link)"/>
      <text x="748" y="667" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HTTP proxy route</text>
      <text x="40" y="700" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">SOURCE: TERRAFORM + ANSIBLE DECLARATIONS · RUNTIME STATE NOT IMPLIED</text>
    </svg>
