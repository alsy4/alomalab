      <text x="732" y="313" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".03em">/MNT/SHARED</text>

      <path d="M676 448 H868 Q876 448 876 440 V408" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#alomalab-arrow)"/>
      <rect x="708" y="460" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="776" y="469" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".03em">MEDIA + SHARED MOUNTS</text>

      <path d="M760 204 H448 Q440 204 440 212 V380 Q440 388 448 388 H580 Q588 388 588 396 V412" fill="none" stroke="#2e5aa8" stroke-width="1.1" marker-end="url(#alomalab-arrow-link)"/>
      <rect x="584" y="368" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="377" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".03em">REVERSE PROXY :8096</text>

